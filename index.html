<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicTacToe</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">

  <div class="setup" id="setupDiv">
    <input type="text" id="p1" placeholder="Player 1 Name">
    <input type="text" id="p2" placeholder="Player 2 Name">
    <button id="startBtn">Start Game</button>
  </div>

    <div class="grid">

      <div class="row">
        <div id="0" class="col"></div>
        <div id="1" class="col"></div>
        <div id="2" class="col"></div>
      </div>
      <div class="row">
        <div id="3" class="col"></div>
        <div id="4" class="col"></div>
        <div id="5" class="col"></div>
      </div>
      <div class="row">
        <div id="6" class="col"></div>
        <div id="7" class="col"></div>
        <div id="8" class="col"></div>
      </div>
    </div>
    <h1></h1>
  </div>
  <script src="./script.js"></script>
</body>
</html>
